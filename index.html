<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css?v=2">
    <title>Letter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
      </style>
    <title>Letter</title>
  </head>
  <body>
    <!-- Envelope Screen -->
    <div id="envelope-container">
      <img src="heart-emoji.jpeg" alt="Heart Emoji" id="envelope" />
      <p> Letter for You 🤍</p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">Melanie/Makandal/Brandon, You're amaing in every way, and i'm so grateful I get to have you in my life, 
           I simply think you're the best, and I want you to be mine. Will you be my girlfriend? ?</h1>

        <img src="star-bg.gif" class="star-bg" id="letter-cat" />

        <div class="buttons" id="letter-buttons">
          <img src="yes.png" class="btn yes-btn" alt="Yes" />

          <div class="no-wrapper">
            <img src="no.png" class="btn no-btn" alt="No" />
          </div>
        </div>
      </div>
    </div>
    <p id="final-text" style="display:none;">I’m so hhappy! 💖</p>
    <audio id="yipee-sound">
      <source src="catyipeee.mp3" type="audio/mpeg">
    </audio>
    <script src="script.js?v=5"></script>  
  </body>
</html>
